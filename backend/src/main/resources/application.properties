# =========================
# Application
# =========================
spring.application.name=urbansync-backend

server.port=8080
spring.jpa.open-in-view=false

# =========================
# PostgreSQL
# =========================
spring.datasource.url=jdbc:postgresql://localhost:5432/urbansync_db
spring.datasource.username=urbansync_user
spring.datasource.password=urbansync1234
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================
# Hibernate / JPA
# =========================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=none

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================
# Logging
# =========================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# =========================
# JWT
# =========================

jwt.secret=7F1D7C5A8E3B6C9F2A4D8E1F6B3A9C7D5E2F8A1C4D6B9E3F7A2C5D8E1F6A9B4C
jwt.expiration=86400000